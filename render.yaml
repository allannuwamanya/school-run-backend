services:
  - type: web
    name: schoolrun-api
    runtime: docker
    repo: https://github.com/YOUR_USERNAME/school-run-be
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: schoolrun-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://school-run-fe.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://schoolrun-api.onrender.com
      - key: DB_CHOICE
        value: postgres
      - key: DATABASE_URL
        # Neon Postgres connection string (direct/non-pooled endpoint — see
        # the note in .env.example). Paste it into this env var in the
        # Render dashboard after the first deploy; never commit it here.
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: schoolrun-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: schoolrun-redis
          property: connectionString
      - key: SITE_NAME
        value: SchoolRun
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: redis
    name: schoolrun-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

# Database: Neon (external, not Render-managed) — see the DATABASE_URL
# env var above. The Render-managed Postgres addon this project used to
# provision here has been removed in favor of Neon.
