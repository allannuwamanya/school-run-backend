services:
  - type: web
    name: schoolrun-api
    runtime: docker
    repo: https://github.com/YOUR_USERNAME/school-run-be
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: schoolrun-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://schoolrun-api.onrender.com
      - key: DB_CHOICE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: schoolrun-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: schoolrun-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: schoolrun-redis
          property: connectionString
      - key: SITE_NAME
        value: SchoolRun
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: redis
    name: schoolrun-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: schoolrun-db
    plan: free
    region: oregon
    postgresMajorVersion: 16
    ipAllowList: []
