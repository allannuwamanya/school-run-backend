name: Sync to allaninfo-tech

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to allaninfo-tech/school-run-be
        run: |
          git remote add allaninfo https://x-access-token:${{ secrets.ALLANINFO_PAT }}@github.com/allaninfo-tech/school-run-be.git
          git push --force allaninfo main
