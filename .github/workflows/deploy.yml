name: Deploy backend to VPS

# Every push to main ships the backend to the VPS: package the committed code,
# copy it over SSH, and rebuild the compose stack. The VPS never needs GitHub
# access (org policy disables deploy keys) — Actions pushes to it instead.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Package committed code
        # git archive excludes gitignored files, so .env and the Firebase key
        # already on the server are never overwritten — tar-extract only adds/
        # updates tracked files.
        run: git archive --format=tar.gz -o backend.tar.gz HEAD

      - name: Copy to VPS
        run: |
          scp -i ~/.ssh/id_ed25519 backend.tar.gz \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/schoolrun/backend.tar.gz"

      - name: Extract and rebuild
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -e; cd /opt/schoolrun && tar xzf backend.tar.gz -C backend && cd backend && docker compose up -d --build && docker image prune -f'
