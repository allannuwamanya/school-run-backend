# Host nginx vhost for schoolrun.oddshoesdev.xyz.
#
# Routes one domain to both apps running as local containers:
#   /api, /admin, /health  -> Django backend   (127.0.0.1:8010)
#   /static, /media        -> served straight from disk
#   everything else        -> React frontend SPA (127.0.0.1:8020)
#
# This is the plain-HTTP config. Run certbot --nginx afterwards and it will
# rewrite this file to add the :443 TLS server block + an HTTP->HTTPS redirect.
#
# Install:  cp to /etc/nginx/sites-available/, symlink into sites-enabled/,
#           `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name schoolrun.oddshoesdev.xyz;

    # Child photos etc. — keep in step with any DRF upload limits.
    client_max_body_size 20M;

    location /static/ {
        alias /home/schoolrun/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /home/schoolrun/media/;
        access_log off;
        expires 7d;
    }

    location ~ ^/(api|admin|health)/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
