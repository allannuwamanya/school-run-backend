services:
  schoolrun-web:
    build: .
    image: schoolrun-web:latest
    container_name: schoolrun-web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /home/schoolrun/staticfiles:/app/staticfiles
      - /home/schoolrun/media:/app/media
    ports:
      - "127.0.0.1:8010:8000"
    networks:
      - app-network
    depends_on:
      schoolrun-postgres:
        condition: service_healthy
      schoolrun-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  schoolrun-celery:
    build: .
    image: schoolrun-web:latest
    container_name: schoolrun-celery
    restart: unless-stopped
    env_file:
      - .env
    # entrypoint.sh hardcodes `exec uvicorn ...` as its last line (not
    # `exec "$@"`), so overriding just `command:` here would still run
    # migrate/collectstatic and then start uvicorn anyway. Bypass it
    # entirely — only schoolrun-web should run migrate/collectstatic.
    entrypoint: []
    command: ["celery", "-A", "main", "worker", "--loglevel=info"]
    volumes:
      - /home/schoolrun/media:/app/media
    networks:
      - app-network
    depends_on:
      schoolrun-postgres:
        condition: service_healthy
      schoolrun-redis:
        condition: service_healthy
      schoolrun-web:
        condition: service_healthy

  schoolrun-postgres:
    # PostGIS image — GeoDjango stores native geography columns (pickup
    # points, GPS trails), so a plain postgres image won't do.
    image: postgis/postgis:16-3.4
    container_name: schoolrun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schoolrun}
      POSTGRES_USER: ${POSTGRES_USER:-schoolrun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - schoolrun_pg_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schoolrun} -d ${POSTGRES_DB:-schoolrun}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No `ports:` — only reachable inside app-network by service name.

  schoolrun-redis:
    image: redis:7-alpine
    container_name: schoolrun-redis
    restart: unless-stopped
    volumes:
      - schoolrun_redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    # No `ports:` — only reachable inside app-network by service name.

volumes:
  schoolrun_redis_data:
  schoolrun_pg_data:

networks:
  app-network:
    external: true
